service: bastuimperiet
#---------------------------------------------------------------------
plugins:
    - serverless-offline
#---------------------------------------------------------------------
provider:
    name: aws
    runtime: nodejs20.x
    region: eu-north-1
    stage: ${env:STAGE, 'dev'}
    environment:
        STAGE: ${env:STAGE, 'dev'}
    httpApi:
        cors:
            allowedOrigins:
                - "*"
            allowedMethods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
                - OPTIONS
            allowedHeaders:
                - Content-Type
    iamRoleStatements:
        - Effect: "Allow"
          Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:Scan
              - dynamodb:Query
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
          Resource: "arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:TABLE_NAME}"
        - Effect: "Allow"
          Action:
              - s3:PutObject
              - s3:GetObject
          Resource: "arn:aws:s3:::${env:BUCKET_NAME}/*"
#---------------------------------------------------------------------
functions:
    hello:
        handler: src/functions/GetHello/index.handler
        events:
            - httpApi:
                  path: /hello
                  method: GET
