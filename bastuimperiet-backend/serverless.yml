# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: annelies
service: bastuimperiet
useDotenv: true
#---------------------------------------------------------------------
plugins:
    - serverless-offline
#---------------------------------------------------------------------
package:
    individually: true

# build:
#     esbuild:
#         bundle: true
#         minify: false
#         sourcemap: false
#         target: node20
#         platform: node
#         format: esm
#     external:
#         - aws-sdk
#         - jsonwebtoken

#---------------------------------------------------------------------
provider:
    name: aws
    runtime: nodejs20.x
    region: eu-north-1
    stage: ${env:STAGE, 'dev'}
    environment:
        STAGE: ${env:STAGE, 'dev'}
        TABLE_NAME: ${env:TABLE_NAME}
        BUCKET_NAME: ${env:BUCKET_NAME}
        JWT_SECRET: ${env:JWT_SECRET}
        ADMIN_EMAIL: ${env:ADMIN_EMAIL}
        SES_FROM_EMAIL: ${env:SES_FROM_EMAIL}
        SES_FROM_NAME: ${env:SES_FROM_NAME}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${env:GOOGLE_SERVICE_ACCOUNT_JSON}
        GOOGLE_CALENDAR_ID: ${env:GOOGLE_CALENDAR_ID}
        GOOGLE_CALENDAR_TIMEZONE: ${env:GOOGLE_CALENDAR_TIMEZONE}
    httpApi:
        cors:
            allowedOrigins:
                - "*"
            allowedMethods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
                - OPTIONS
            allowedHeaders:
                - Content-Type
                - Authorization
    iamRoleStatements:
        - Effect: "Allow"
          Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:Scan
              - dynamodb:Query
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
          Resource:
              - "arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:TABLE_NAME}"
              - "arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:TABLE_NAME}/index/*"
        - Effect: "Allow"
          Action:
              - s3:PutObject
              - s3:GetObject
              - s3:PutBucketPolicy
          Resource: "arn:aws:s3:::${env:BUCKET_NAME}/*"
        - Effect: "Allow"
          Action:
              - ses:SendEmail
          Resource: "*"

#---------------------------------------------------------------------
functions:
    adminLogin:
        handler: src/functions/Admin/login.handler
        events:
            - httpApi:
                  path: /admin/login
                  method: POST
    getBookings:
        handler: src/functions/Bookings/getBookings.handler
        events:
            - httpApi:
                  path: /bookings
                  method: GET
    getBookingsById:
        handler: src/functions/Bookings/getBookingById.handler
        events:
            - httpApi:
                  path: /bookings/{id}
                  method: GET
    patchBooking:
        handler: src/functions/Bookings/patchBooking.handler
        events:
            - httpApi:
                  path: /bookings/{id}
                  method: PATCH
    postBooking:
        handler: src/functions/Bookings/postBooking.handler
        events:
            - httpApi:
                  path: /bookings
                  method: POST
    validateBookingStep:
        handler: src/functions/Bookings/validateBookingStep.handler
        events:
            - httpApi:
                  path: /bookings/validate
                  method: POST
    getPrices:
        handler: src/functions/Price/getPrices.handler
        events:
            - httpApi:
                  path: /prices
                  method: GET
    calculatePrice: # NY FUNKTION
        handler: src/functions/Price/calculatePrice.handler
        events:
            - httpApi:
                  path: /prices/calculate
                  method: POST

#---------------------------------------------------------------------
# DynamoDB Single Table Design
resources:
    Resources:
        BastuimperietTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${env:TABLE_NAME}
                BillingMode: PAY_PER_REQUEST

                # Attribut
                AttributeDefinitions:
                    - AttributeName: PK
                      AttributeType: S
                    - AttributeName: SK
                      AttributeType: S

                    - AttributeName: GSI1PK
                      AttributeType: S
                    - AttributeName: GSI1SK
                      AttributeType: S

                    - AttributeName: GSI2PK
                      AttributeType: S
                    - AttributeName: GSI2SK
                      AttributeType: S

                # Primärnycklar
                KeySchema:
                    - AttributeName: PK
                      KeyType: HASH
                    - AttributeName: SK
                      KeyType: RANGE

                # GSI:er
                GlobalSecondaryIndexes:
                    - IndexName: GSI1
                      KeySchema:
                          - AttributeName: GSI1PK
                            KeyType: HASH
                          - AttributeName: GSI1SK
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

                    - IndexName: GSI2
                      KeySchema:
                          - AttributeName: GSI2PK
                            KeyType: HASH
                          - AttributeName: GSI2SK
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

        BastuimperietBucket:
            Type: AWS::S3::Bucket
            Properties:
                BucketName: ${env:BUCKET_NAME}
