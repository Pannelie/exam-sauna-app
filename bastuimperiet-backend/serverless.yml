service: bastuimperiet
#---------------------------------------------------------------------
plugins:
    - serverless-offline
#---------------------------------------------------------------------
provider:
    name: aws
    runtime: nodejs20.x
    region: eu-north-1
    stage: ${env:STAGE, 'dev'}
    environment:
        STAGE: ${env:STAGE, 'dev'}
    httpApi:
        cors:
            allowedOrigins:
                - "*"
            allowedMethods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
                - OPTIONS
            allowedHeaders:
                - Content-Type
    iamRoleStatements:
        - Effect: "Allow"
          Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:Scan
              - dynamodb:Query
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
          Resource:
              - "arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:TABLE_NAME}"
              - "arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:TABLE_NAME}/index/*"
        - Effect: "Allow"
          Action:
              - s3:PutObject
              - s3:GetObject
          Resource: "arn:aws:s3:::${env:BUCKET_NAME}/*"

#---------------------------------------------------------------------
functions:
    hello:
        handler: src/functions/GetHello/index.handler
        events:
            - httpApi:
                  path: /hello
                  method: GET

#---------------------------------------------------------------------
# DynamoDB Single Table Design
resources:
    Resources:
        BastuimperietTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${env:TABLE_NAME}
                BillingMode: PAY_PER_REQUEST

                # Attribut
                AttributeDefinitions:
                    - AttributeName: PK
                      AttributeType: S
                    - AttributeName: SK
                      AttributeType: S

                    - AttributeName: GSI1PK
                      AttributeType: S
                    - AttributeName: GSI1SK
                      AttributeType: S

                    - AttributeName: GSI2PK
                      AttributeType: S
                    - AttributeName: GSI2SK
                      AttributeType: S

                # Primärnycklar
                KeySchema:
                    - AttributeName: PK
                      KeyType: HASH
                    - AttributeName: SK
                      KeyType: RANGE

                # GSI:er
                GlobalSecondaryIndexes:
                    - IndexName: GSI1
                      KeySchema:
                          - AttributeName: GSI1PK
                            KeyType: HASH
                          - AttributeName: GSI1SK
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

                    - IndexName: GSI2
                      KeySchema:
                          - AttributeName: GSI2PK
                            KeyType: HASH
                          - AttributeName: GSI2SK
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL
